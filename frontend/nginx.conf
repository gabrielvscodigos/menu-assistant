# Serves the built front end and forwards /api/* to the API container, so the browser
# talks to a single origin (no CORS), exactly like the Vite dev proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /api/ask -> http://api:8000/ask (the trailing slash strips the /api prefix).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A local LLM on CPU can take a while to answer.
        proxy_read_timeout 300s;
    }

    # Hashed build assets never change, so browsers may keep them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
