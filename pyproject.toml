[project]
name = "menu-assistant"
version = "0.1.0"
description = "RAG-based assistant that suggests dishes from a restaurant menu."
authors = [
    { name = "Gabriel de Vasconcelos" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
menu-ask = "menu_assistant.rag.__main__:main"
menu-ingest = "menu_assistant.ingest.__main__:main"
menu-eval = "menu_assistant.eval.__main__:main"
menu-eval-answers = "menu_assistant.eval.answers:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.coverage.run]
source = ["menu_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Use CPU-only PyTorch wheels: no GPU is needed for a small embedding model, and the
# default Linux wheels pull several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
